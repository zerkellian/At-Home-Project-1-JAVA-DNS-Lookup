name: Build Java JAR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile Java files
        run: |
          mkdir -p out
          find . -name "*.java" ! -path "*/.*" > sources.txt
          javac -d out @sources.txt

      - name: Package into runnable JAR
        run: jar --create --file NetworkInspector.jar --main-class NetworkInspector -C out .

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-jar
          path: app.jar
